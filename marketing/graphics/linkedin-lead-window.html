<!doctype html><html><head><meta charset="utf-8">
<style>
html,body{margin:0}
body{width:1080px;height:1350px;font-family:"Liberation Sans",Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.top{position:relative;flex:1;color:#fff;padding:0 80px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;
 background:
  radial-gradient(circle at 88% 8%, rgba(47,141,210,.45), transparent 42%),
  radial-gradient(circle at 5% 95%, rgba(254,103,1,.28), transparent 40%),
  linear-gradient(160deg,#00122E 0%,#001E47 55%,#00285E 100%);}
.top:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.10) 1.6px,transparent 1.6px);background-size:36px 36px;mask-image:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,.2))}
.net{position:absolute;right:-120px;top:-110px;opacity:.3}
.z{position:relative;z-index:2}
.big{font-size:240px;font-weight:800;line-height:.9;letter-spacing:-6px;background:linear-gradient(180deg,#FF8A3D,#FE6701 60%,#E85A00);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 28px rgba(254,103,1,.45))}
.kicker{font-size:28px;letter-spacing:6px;font-weight:700;color:#5BB8FF}
.head{font-size:132px;font-weight:800;line-height:.98;margin-top:18px;letter-spacing:-2px}
.head span{background:linear-gradient(180deg,#FF8A3D,#FE6701 60%,#E85A00);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(254,103,1,.5))}
.tl{margin-top:56px;position:relative}
.tlbar{display:flex;height:70px;border-radius:35px;overflow:hidden}
.win{width:16.6%;background:linear-gradient(90deg,#FE6701,#FF9A4D);box-shadow:0 0 34px rgba(254,103,1,.7);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;letter-spacing:1px;color:#fff;text-align:center;line-height:1.1}
.cold{flex:1;background:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 14px,rgba(255,255,255,.06) 14px 28px);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;letter-spacing:4px;color:rgba(255,255,255,.5)}
.ticks{position:relative;height:40px;margin-top:12px;font-size:26px;font-weight:700;color:#C9D6E8}
.ticks span{position:absolute;transform:none}
.lead .o{color:#FF8A3D}
.stat{display:flex;align-items:center;gap:34px;margin-top:40px;padding:26px 34px;border-radius:24px;background:rgba(254,103,1,.10);border:2px solid rgba(254,103,1,.55);box-shadow:0 0 40px rgba(254,103,1,.18)}
.num{font-size:120px;font-weight:800;line-height:.9;letter-spacing:-3px;background:linear-gradient(180deg,#FF8A3D,#FE6701 60%,#E85A00);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(254,103,1,.55));flex:none}
.st{font-size:34px;line-height:1.3;color:#E6ECF5}
.st b{color:#fff}
.lead{font-size:36px;line-height:1.35;margin-top:34px;color:#E6ECF5;max-width:860px}
.lead b{color:#fff}
.bars{margin-top:60px}
.bar{display:flex;align-items:center;margin-bottom:24px}
.bar .lab{width:150px;font-size:34px;font-weight:700}
.bar .fill{height:56px;border-radius:28px;display:flex;align-items:center;justify-content:flex-end;padding-right:18px;box-sizing:border-box;font-size:24px;font-weight:700}
.b5 .fill{width:200px;background:linear-gradient(90deg,#FE6701,#FF9A4D);box-shadow:0 0 30px rgba(254,103,1,.6);color:#fff}
.b30 .fill{width:720px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 14px,rgba(255,255,255,.07) 14px 28px);color:rgba(255,255,255,.55)}
.flow{position:relative;margin-top:64px;display:flex;justify-content:space-between}
.line{position:absolute;left:100px;right:100px;top:78px;height:4px;background:repeating-linear-gradient(90deg,#2F8DD2 0 16px,transparent 16px 28px);z-index:0}
.ic{position:relative;z-index:1;text-align:center;width:215px}
.circle{width:156px;height:156px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle at 35% 30%,#3FA3EC,#1D6FB0 70%);box-shadow:0 0 0 6px rgba(47,141,210,.25),0 10px 30px rgba(0,0,0,.35)}
.ic.ai .circle{background:radial-gradient(circle at 35% 30%,#5BB8FF,#2F8DD2 45%,#123E7A);box-shadow:0 0 0 6px rgba(91,184,255,.35),0 0 40px rgba(91,184,255,.65)}
.ic.h .circle{background:radial-gradient(circle at 35% 30%,#FF9A4D,#FE6701 65%);box-shadow:0 0 0 6px rgba(254,103,1,.3),0 0 46px rgba(254,103,1,.7)}
.ic .w{margin-top:22px;font-size:30px;font-weight:700;line-height:1.2}
.note{font-size:22px;font-weight:400;color:#FF9A4D;margin-top:4px}
.bottom{height:170px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 80px;border-top:6px solid #FE6701}
.bottom img{height:110px}
.src{font-size:22px;color:#8A93A0;text-align:right;line-height:1.5}
</style></head><body>
<div class="top">
 <svg class="net" width="520" height="420" viewBox="0 0 520 420" fill="none" stroke="#5BB8FF" stroke-width="1.5">
  <path d="M40 80L180 40L320 120L470 60M180 40L220 200L320 120L420 250L470 60M220 200L90 260L40 80M220 200L420 250"/>
  <g fill="#5BB8FF" stroke="none"><circle cx="40" cy="80" r="6"/><circle cx="180" cy="40" r="7"/><circle cx="320" cy="120" r="8"/><circle cx="470" cy="60" r="6"/><circle cx="220" cy="200" r="9"/><circle cx="90" cy="260" r="5"/><circle cx="420" cy="250" r="7"/></g>
 </svg>
 <div class="z">
 <div class="kicker">CAPTURING A LEAD</div>
 <div class="head">The window<br>is <span>small.</span></div>
 <div class="tl">
  <div class="tlbar"><div class="win">YOUR<br>WINDOW</div><div class="cold">LEAD GOES COLD</div></div>
  <div class="ticks"><span style="left:0">0</span><span style="left:16.6%">5 min</span><span style="right:0">30 min</span></div>
 </div>
 <div class="stat"><div class="num">21x</div><div class="st">more likely to land the lead when you reply within <b>5 minutes</b> instead of 30.</div></div>
 <div class="flow">
  <div class="line"></div>
  <div class="ic"><div class="circle"><svg width="74" height="74" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/><path d="M7.8 10.6l1.9 1.9 3.4-3.6"/></svg></div><div class="w">Old process check</div></div>
  <div class="ic"><div class="circle"><svg width="74" height="74" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-13.7 5.6"/><path d="M4 12a8 8 0 0 1 13.7-5.6"/><path d="M18 2.5v4h-4"/><path d="M6 21.5v-4h4"/></svg></div><div class="w">Consistency</div></div>
  <div class="ic ai"><div class="circle">
   <svg width="108" height="108" viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 9c-4-3.5-11-3-14 2-6 .5-9 6-7.5 11-5 3-5.5 10-1.5 13.5-2 5 1.5 11 7 11.5 1.5 5 7.5 7.5 12 5 1.8 1.5 3 1.8 4 1.8z"/>
    <path d="M20 18c3 0 5 2 5 5M14 30c3-1 6 0 7.5 2.5M17 43c1-3 4-5 7.5-4.5M26 50c0-3 2-5 6-5"/>
    <path d="M32 9v45"/>
    <path d="M32 16h8l4-4h6M32 26h12l4 4h6M32 36h9l3 4v6M32 46h6"/>
    <g fill="#fff" stroke="none"><circle cx="52" cy="12" r="2.6"/><circle cx="56" cy="30" r="2.6"/><circle cx="44" cy="48" r="2.6"/><circle cx="40" cy="46" r="2.2"/><circle cx="40" cy="16" r="2"/></g>
   </svg></div><div class="w">AI agent</div></div>
  <div class="ic h"><div class="circle"><svg width="78" height="78" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="7.5" r="4.2"/><path d="M3.5 21c.8-4.6 4.3-7 8.5-7s7.7 2.4 8.5 7z"/></svg></div><div class="w">You<div class="note">(most importantly)</div></div></div>
 </div>
 </div>
</div>
<div class="bottom"><img src="logo.webp"><div class="src">Stat: MIT lead response study<br>pwslocal.com</div></div>
</body></html>
