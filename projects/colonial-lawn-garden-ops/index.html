<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colonial Lawn & Garden Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --green-900:#111111; --green-800:#2f6e35; --green-700:#3b8741; --green-100:#e2f0e3; --green-50:#f1f8f1;
  --brass:#b8893a; --brass-100:#f6ecd9;
  --bg:#f5f3ee; --surface:#ffffff; --surface-2:#faf9f6; --line:#e3e0d8;
  --text:#1d231f; --muted:#646b66;
  --blue:#2f6db5; --blue-100:#e3edf9;
  --amber:#b7791f; --amber-100:#fbf0dc;
  --red:#b3412f; --red-100:#f8e2de;
  --gray-100:#eeede9;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.2}
.brand-font{font-family:"Libre Baskerville",Georgia,serif}

/* ---------- top bar ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#111}
header.top{background:#fff;color:var(--text);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.strip{background:#111;color:#fff;font-size:12px;text-align:center;padding:6px 16px;letter-spacing:.3px}
.logo-img{height:38px;width:auto;display:block;max-width:100%}
@media (max-width:500px){.logo-img{height:26px}}
.top-inner{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo-text{font-size:17px;letter-spacing:.2px}
.logo-sub{font-size:11px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin-top:4px}
.demo-pill{background:var(--green-50);border:1px solid #cfe5d1;color:var(--green-800);font-size:11px;padding:3px 9px;border-radius:999px;letter-spacing:.3px}
.reset-btn{background:#fff;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
.reset-btn:hover{background:var(--surface-2)}
nav.roles{background:var(--green-700);overflow-x:auto}
.roles-inner{max-width:1280px;margin:0 auto;padding:0 16px;display:flex;gap:4px}
.role-tab{background:none;border:0;color:rgba(255,255,255,.85);padding:11px 14px;cursor:pointer;font-weight:500;white-space:nowrap;border-bottom:3px solid transparent}
.role-tab:hover{color:#fff}
.role-tab.active{color:#fff;border-bottom-color:#fff;font-weight:700}
.role-tab .ct{background:#fff;color:var(--green-800);border-radius:999px;font-size:11px;padding:0 6px;margin-left:6px;font-weight:700}

main{max-width:1280px;margin:0 auto;padding:20px 16px 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head h2{font-size:22px}
.page-head p{margin:4px 0 0;color:var(--muted)}

/* ---------- generic ---------- */
.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:16px}
.card h3{font-size:15px;margin-bottom:10px}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:900px){.g-2,.g-3,.g-side{grid-template-columns:minmax(0,1fr)}.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.row.between{flex-wrap:wrap}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack>*+*{margin-top:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--green-700);border-color:var(--green-700);color:#fff}
.btn-primary:hover{background:var(--green-800)}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-danger:hover{filter:brightness(.95);background:var(--red)}
.btn-big{width:100%;padding:16px;font-size:16px;border-radius:12px}
.btn-sm{padding:5px 10px;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.b-green{background:var(--green-100);color:var(--green-800)}
.b-blue{background:var(--blue-100);color:var(--blue)}
.b-amber{background:var(--amber-100);color:var(--amber)}
.b-red{background:var(--red-100);color:var(--red)}
.b-gray{background:var(--gray-100);color:var(--muted)}
.b-brass{background:var(--brass-100);color:#7d5a1d}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.pulse{background:#3cb371;box-shadow:0 0 0 0 rgba(60,179,113,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(60,179,113,0)}100%{box-shadow:0 0 0 0 rgba(60,179,113,0)}}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.sel td{background:var(--green-50)}
.table-wrap{overflow-x:auto}
.kpi .n{font-size:28px;font-weight:700;letter-spacing:-.5px}
.kpi .l{color:var(--muted);font-size:12px;font-weight:500}
.progress{height:8px;background:var(--gray-100);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--green-700);border-radius:999px;transition:width .3s}
.empty{padding:30px;text-align:center;color:var(--muted)}
.note{background:var(--brass-100);border:1px solid #ecd9b4;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#5e4415}

/* ---------- technician phone ---------- */
.tech-layout{display:grid;grid-template-columns:420px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.tech-layout{grid-template-columns:1fr}}
.phone{background:#111;border-radius:38px;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.18);max-width:420px;width:100%;margin:0 auto}
.phone-screen{background:var(--bg);border-radius:28px;overflow:hidden;height:760px;display:flex;flex-direction:column}
@media (max-width:500px){.phone{padding:0;border-radius:16px;background:none;box-shadow:none}.phone-screen{border-radius:16px;height:auto;min-height:600px;border:1px solid var(--line)}}
.app-head{background:var(--green-800);color:#fff;padding:16px 16px 14px}
.app-head .hi{font-size:12px;opacity:.8}
.app-head .nm{font-size:18px;font-weight:700}
.app-body{flex:1;overflow-y:auto;padding:14px}
.job-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;position:relative}
.job-card+.job-card{margin-top:10px}
.job-card:hover{border-color:var(--green-700)}
.job-card .t{font-weight:700;font-size:15px}
.job-card.active{border:2px solid #3cb371}
.timer{font-variant-numeric:tabular-nums;font-size:38px;font-weight:700;letter-spacing:-1px;text-align:center}
.svc{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
.svc:last-child{border-bottom:0}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;margin-top:1px}
.check.done .box{background:var(--green-700);border-color:var(--green-700)}
.check.done .box::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check.done .lbl{text-decoration:line-through;color:var(--muted)}
.back{background:none;border:0;color:#fff;padding:0;cursor:pointer;font-size:13px;opacity:.85;margin-bottom:6px}
.app-tabs{display:flex;border-top:1px solid var(--line);background:var(--surface)}
.app-tabs button{flex:1;background:none;border:0;padding:10px 0 12px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.app-tabs button.on{color:var(--green-700)}
.app-tabs .ic{display:block;font-size:18px;margin-bottom:2px}
.explain h3{font-size:18px;margin-bottom:8px}
.explain ol{padding-left:18px;margin:8px 0}
.explain li{margin:6px 0}

/* ---------- schedule grid ---------- */
.sched{display:grid;grid-template-columns:140px repeat(6,minmax(120px,1fr));min-width:900px}
.sched>div{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px;min-height:64px}
.sched .hd{background:var(--surface-2);font-weight:600;font-size:12px;min-height:auto}
.sched .hd.today{background:var(--green-100);color:var(--green-800)}
.sched .tn{font-weight:600;background:var(--surface-2)}
.chip{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--green-700);background:var(--green-50);border-radius:6px;padding:5px 7px;font-size:11.5px;margin-bottom:5px;cursor:pointer;line-height:1.3}
.chip:hover{filter:brightness(.97)}
.chip.s-in_progress{border-left-color:#3cb371;background:#e2f5e9}
.chip.s-done{border-left-color:#9aa39d;background:var(--gray-100);color:var(--muted)}
.chip.s-scheduled{border-left-color:var(--blue);background:var(--blue-100)}

/* ---------- kanban ---------- */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:200px}
.col h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:2px 4px 10px;display:flex;justify-content:space-between}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer}
.tk:hover{border-color:var(--green-700)}
.tk .id{font-size:11px;color:var(--muted);font-weight:600}
.tk .tt{font-weight:600;margin:3px 0 6px}

/* ---------- reception ---------- */
.transcript{max-height:380px;overflow-y:auto;padding-right:4px}
.line{display:flex;gap:10px;margin-bottom:10px}
.line .who{flex:none;width:76px;font-size:11px;font-weight:700;color:var(--muted);padding-top:2px;text-transform:uppercase;letter-spacing:.3px}
.line.rec .who{color:var(--green-700)}
.line .txt{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;flex:1}
.line.rec .txt{background:var(--green-50);border-color:#cfe3d6}
mark{background:#ffe79a;padding:0 1px;border-radius:2px}
.player{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.play{width:32px;height:32px;border-radius:50%;border:0;background:var(--green-700);color:#fff;cursor:pointer;flex:none}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:30px}
.wave i{flex:1;background:#b9cfc1;border-radius:2px}
.wave i.p{background:var(--green-700)}
.rec-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;font-size:12.5px;font-weight:600}
.rec-chip.on{border-color:var(--green-700);background:var(--green-50)}
.av{width:24px;height:24px;border-radius:50%;background:var(--green-700);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;flex:none}

/* ---------- modal & toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(20,30,24,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-body{padding:18px}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--green-900);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.map-layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px;align-items:start}
@media (max-width:900px){.map-layout{grid-template-columns:minmax(0,1fr)}}
.map-wrap svg{width:100%;height:auto;display:block}
.map-st{font-size:13px;fill:#8b938d;font-weight:500}
.map-lbl{font-size:14px;fill:#2b312d;font-weight:600;paint-order:stroke;stroke:#eef3ec;stroke-width:4px}
.map-ini{font-size:12px;font-weight:700;fill:#fff;pointer-events:none}
.map-pin{cursor:pointer}
@media (prefers-reduced-motion:reduce){.map-pin animate{display:none}.pulse{animation:none}}
.nav-links{display:inline-flex;flex-wrap:wrap;gap:6px}
.nav-links .btn{text-decoration:none;color:var(--text)}
.team-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.person{cursor:pointer;display:flex;flex-direction:column;gap:12px}
.person:hover,.person:focus-visible{border-color:var(--green-700);outline:none}
.person-contact{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.av-lg{width:44px;height:44px;font-size:15px}
.av-xl{width:52px;height:52px;font-size:17px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
</style>
</head>

let state;
try { state = JSON.parse(localStorage.getItem(STORE_KEY)); } catch(e){ state = null; }
if(!state || !state.jobs) state = seed();
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

/* ---------- lookups ---------- */
const tech = id => state.techs.find(t=>t.id===id);
const client = id => state.clients[id];
const job = id => state.jobs.find(j=>j.id===id);
const equip = id => state.equipment.find(e=>e.id===id);
const recp = id => state.receptionists.find(r=>r.id===id);
const jobTotal = j => j.services.reduce((a,s)=>a+s.price,0);
const taskCount = j => j.services.reduce((a,s)=>a+s.tasks.length,0);
const elapsed = j => j.clockIn ? ((j.clockOut||Date.now()) - j.clockIn) : 0;
const statusBadge = s => ({scheduled:'<span class="badge b-blue">Scheduled</span>', in_progress:'<span class="badge b-green"><span class="dot pulse"></span>On site</span>', done:'<span class="badge b-gray">Complete</span>'}[s]);
const prioBadge = p => `<span class="badge ${p==='High'?'b-red':p==='Medium'?'b-amber':'b-gray'}">${p}</span>`;
/* one tap from an address to turn-by-turn directions */
function mapLinks(addr){
  const q = encodeURIComponent(addr + ', WA');
  return `<span class="nav-links"><a class="btn btn-sm" href="https://www.google.com/maps/dir/?api=1&destination=${q}" target="_blank" rel="noopener">🧭 Google Maps</a><a class="btn btn-sm" href="https://maps.apple.com/?daddr=${q}" target="_blank" rel="noopener">🧭 Apple Maps</a></span>`;
}
function locBadge(j, which){
  const loc = which==='out' ? j.outLoc : j.inLoc; if(!loc) return '';
  const ft = distFt(loc, client(j.clientId).pos);
  return ft <= GEOFENCE_FT ? `<span class="badge b-green">📍 At property · ${fmtDist(ft)}</span>` : `<span class="badge b-red">⚠ ${fmtDist(ft)} from property</span>`;
}
const locFlagged = j => [j.inLoc,j.outLoc].some(l=>l && distFt(l, client(j.clientId).pos) > GEOFENCE_FT);
const eqBadge = s => `<span class="badge ${s==='Down'?'b-red':s==='OK'?'b-green':'b-amber'}">${s}</span>`;

/* ---------- toast & modal ---------- */
let toastT;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2600); }
function openModal(html){ document.getElementById('modal').innerHTML=html; document.getElementById('modalBg').classList.add('open'); }
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }
document.getElementById('modalBg').addEventListener('click',e=>{ if(e.target.id==='modalBg') closeModal(); });

/* ---------- role tabs ---------- */
const ROLES = [
  ['tech','Technician'],
  ['mgr','Manager'],
  ['mech','Shop / Mechanics'],
  ['rec','Reception'],
  ['hr','HR & Onboarding'],
  ['team','Team'],
];
function renderTabs(){
  const openT = state.tickets.filter(t=>t.status!=='Resolved').length;
  const vmOpen = state.calls.filter(c=>c.type==='voicemail' && !c.handled).length;
  const counts = {mech:openT, rec:vmOpen};
  document.getElementById('roleTabs').innerHTML = ROLES.map(([k,l])=>
    `<button class="role-tab ${state.ui.role===k?'active':''}" data-action="role" data-role="${k}">${l}${counts[k]?`<span class="ct">${counts[k]}</span>`:''}</button>`).join('');
}

function render(){
  renderTabs();
  const v = document.getElementById('view');
  v.innerHTML = ({tech:viewTech, mgr:viewMgr, mech:viewMech, rec:viewRec, hr:viewHR, team:viewTeam}[state.ui.role])();
  save();
}

  </div>`;

function phoneScreen(t){
  const ui = state.ui;
  if(ui.techJob && job(ui.techJob)) return phoneJob(t, job(ui.techJob));
  const today = state.jobs.filter(j=>j.techId===t.id && j.date===dayKey(0)).sort((a,b)=>a.start.localeCompare(b.start));
  const active = today.find(j=>j.status==='in_progress');
  let body = '';
  if(ui.techTab==='today'){
    body = `
      ${active?`<div class="note" style="margin-bottom:12px"><b>On the clock</b> at ${esc(client(active.clientId).name)} · <span data-live="${active.id}">${fmtDur(elapsed(active))}</span></div>`:''}
      <div class="row between" style="margin-bottom:8px"><b>Today's jobs</b><span class="small muted">${today.filter(j=>j.status==='done').length}/${today.length} done</span></div>
      ${today.length?today.map(j=>{ const c=client(j.clientId); return `
        <div class="job-card ${j.status==='in_progress'?'active':''}" data-action="openJob" data-id="${j.id}">
          <div class="row between"><span class="small muted">${fmt12(j.start)} · est. ${j.est} min</span>${statusBadge(j.status)}</div>
          <div class="t" style="margin-top:4px">${esc(c.name)}</div>
          <div class="small muted">${esc(c.address)}</div>
          <div style="margin-top:8px">${mapLinks(c.address)}</div>
          <div class="small" style="margin-top:6px">${j.services.map(s=>esc(s.name)).join(' · ')}</div>
        </div>`}).join(''):'<div class="empty">No jobs today.</div>'}`;
  } else if(ui.techTab==='time'){
    const done = state.jobs.filter(j=>j.techId===t.id && j.clockIn);
    const total = done.reduce((a,j)=>a+elapsed(j),0);
    body = `<b>My timesheet · today</b>
      <div class="card card-pad" style="margin:10px 0;text-align:center"><div class="kpi"><div class="n">${fmtHM(total)}</div><div class="l">on site today</div></div></div>
      ${done.length?done.map(j=>`<div class="svc"><span>${esc(client(j.clientId).name)}<br><span class="small muted">${fmtTime(j.clockIn)} – ${j.clockOut?fmtTime(j.clockOut):'now'}</span></span><b>${fmtHM(elapsed(j))}</b></div>`).join(''):'<div class="empty">No clock-ins yet today.</div>'}`;
  } else {
    body = phoneReportForm(t, null);
  }
  return `
    <div class="app-head"><div class="hi">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div><div class="nm">Hi, ${esc(t.name.split(' ')[0])}</div><div class="small" style="opacity:.8">${esc(t.crew)} · ${esc(t.truck)}</div></div>
    <div class="app-body">${body}</div>
    <div class="app-tabs">
      <button class="${ui.techTab==='today'?'on':''}" data-action="techTab" data-tab="today"><span class="ic">📋</span>Jobs</button>
      <button class="${ui.techTab==='time'?'on':''}" data-action="techTab" data-tab="time"><span class="ic">⏱</span>Timesheet</button>
      <button class="${ui.techTab==='report'?'on':''}" data-action="techTab" data-tab="report"><span class="ic">🔧</span>Report issue</button>
    </div>`;
}

function phoneJob(t, j){

  const locating = state.ui.locating===j.id ? `<button class="btn btn-big" disabled>📍 Checking your location…</button>` : '';
  if(j.status==='scheduled') clockBlock = locating || `<button class="btn btn-primary btn-big" data-action="clockIn" data-id="${j.id}">Clock in · arrived on site</button>`;
  else if(j.status==='in_progress') clockBlock = `<div class="card card-pad" style="text-align:center;margin-bottom:10px"><div class="small muted">On site since ${fmtTime(j.clockIn)}</div><div class="timer" data-live="${j.id}">${fmtDur(elapsed(j))}</div><div class="small muted">Estimate: ${j.est} min</div><div style="margin-top:8px">${locBadge(j,'in')}</div></div>

function techWhere(t, today){
  const mine = today.filter(j=>j.techId===t.id);
  const cur = mine.find(j=>j.status==='in_progress');
  if(cur) return {p:cur.inLoc||client(cur.clientId).pos, kind:'on', job:cur, label:'On site · '+client(cur.clientId).name};
  const last = mine.filter(j=>j.status==='done'&&j.clockOut).sort((a,b)=>b.clockOut-a.clockOut)[0];
  const next = mine.filter(j=>j.status==='scheduled').sort((a,b)=>a.start.localeCompare(b.start))[0];
  if(last && next){ const a=client(last.clientId).pos, b=client(next.clientId).pos; return {p:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}, kind:'drive', job:next, label:'Driving to '+client(next.clientId).name}; }
  if(next) return {p:{x:YARD.x-14+t.id.charCodeAt(1)%4*9,y:YARD.y-6}, kind:'yard', job:next, label:'At the yard · next '+client(next.clientId).name};
  return {p:{x:YARD.x+8,y:YARD.y+8}, kind:'yard', job:null, label:'Done for the day'};
}

function viewRec(){
  const ui = state.ui;
  const q = ui.search.trim().toLowerCase();
  let list = state.calls.filter(c=>(ui.recId==='ALL'||c.recId===ui.recId) && (ui.callFilter==='all'||c.type===ui.callFilter));
  if(q) list = list.filter(c=>(c.caller+' '+c.summary+' '+c.transcript.map(l=>l[1]).join(' ')+' '+c.tags.join(' ')).toLowerCase().includes(q));

function hl(text,q){ const t=esc(text); if(!q) return t; const i=t.toLowerCase().indexOf(esc(q)); return i<0?t:t.slice(0,i)+'<mark>'+t.slice(i,i+esc(q).length)+'</mark>'+t.slice(i+esc(q).length); }

function callDetail(c,q){
  const bars = Array.from({length:48},(_,i)=>`<i style="height:${20+Math.round(Math.abs(Math.sin(i*1.7+c.dur))*80)}%" class="${i<12?'p':''}"></i>`).join('');
  const cl = c.clientId?client(c.clientId):null;
  return `
    <div class="row between" style="align-items:flex-start"><div><div class="small muted">${c.id} · ${c.type==='call'?c.dir+' call':'Voicemail'}</div><h3 style="margin:2px 0 0">${esc(c.caller)}</h3><div class="small muted">${esc(c.from)} · ${fmtDateTime(c.ts)}</div></div>
      ${c.type==='voicemail'?(c.handled?'<span class="badge b-gray">Returned</span>':`<button class="btn btn-sm btn-primary" data-action="vmDone" data-id="${c.id}">Mark returned</button>`):''}</div>
    <div class="player" style="margin:12px 0"><button class="play" data-action="noop" title="Audio playback (mockup)">▶</button><div class="wave">${bars}</div><span class="small muted">${fmtDur(c.dur*1000)}</span></div>
    <div class="small"><b>Handled by</b> ${esc(recp(c.recId).name)} <span class="badge b-brass">${c.recId}</span></div>
    <div class="row wrap" style="margin:8px 0">${c.tags.map(t=>`<span class="badge b-green">${esc(t)}</span>`).join('')} ${cl?`<span class="badge b-blue">Client: ${esc(cl.name)}</span>`:'<span class="badge b-amber">Not in client list</span>'}</div>
    <div class="note" style="margin-bottom:12px"><b>AI summary:</b> ${esc(c.summary)}</div>
    <b>Transcript</b>
    <div class="transcript" style="margin-top:8px">${c.transcript.map(([w,txt])=>`<div class="line ${w==='rec'?'rec':''}"><span class="who">${w==='rec'?esc(recp(c.recId).name.split(' ')[0]):'Caller'}</span><span class="txt">${hl(txt,q)}</span></div>`).join('')}</div>`;
}

function tenure(start){
  const d = new Date(start+'T12:00:00'); if(d > TODAY) return 'Starts '+fmtDay(start);
  const m = (TODAY.getFullYear()-d.getFullYear())*12 + TODAY.getMonth()-d.getMonth();
  if(m < 1) return 'New this month'; const y = Math.floor(m/12), r = m%12;
  return (y?y+' yr'+(y>1?'s':'')+' ':'')+(r?r+' mo':'');
}
function staffStatus(p){
  if(p.techId){ const w = techWhere(tech(p.techId), state.jobs.filter(j=>j.date===dayKey(0)));
    return {cls: w.kind==='on'?'b-green':w.kind==='drive'?'b-blue':'b-gray', txt: w.label}; }
  if(p.empId){ const e = state.employees.find(x=>x.id===p.empId); if(e){ const pr = empProgress(e);
    if(e.start > dayKey(0)) return {cls:'b-blue', txt:'Starts '+fmtDay(e.start)};
    if(pr.pct < 100) return {cls:'b-brass', txt:'Onboarding · '+pr.pct+'%'}; } }
  if(p.recId) return {cls:'b-green', txt:'At the front desk'};
  if(p.start > dayKey(0)) return {cls:'b-blue', txt:'Starts '+fmtDay(p.start)};
  return {cls:'b-gray', txt: p.dept==='Shop' ? 'In the shop' : p.dept==='Field crews' ? 'In the field' : 'In the office'};
}

function empProgress(e){

  const pd = pk.filter(Boolean).length, td = tk.filter(Boolean).length;
  return {pd, pt:pk.length, td, tt:tk.length, pct: Math.round((pd+td)/(pk.length+tk.length)*100)};
}

document.addEventListener('click', e=>{
  if(e.target.closest('a[href]')) return;
  const el = e.target.closest('[data-action]');
  if(!el || el.tagName==='SELECT') return;
  const a = el.dataset.action, id = el.dataset.id, ui = state.ui;
  switch(a){
    case 'role': ui.role = el.dataset.role; break;
    case 'reset': openModal(`<div class="modal-head"><h3>Reset the demo?</h3><button class="x" data-action="closeModal">×</button></div><div class="modal-body stack"><p style="margin:0">This puts back all the sample jobs, tickets, calls and new hires, and clears anything you added.</p><div class="row"><button class="btn btn-danger" data-action="resetYes">Reset demo</button><button class="btn" data-action="closeModal">Cancel</button></div></div>`); return;
    case 'resetYes': state = seed(); closeModal(); toast('Demo data reset'); break;
    case 'closeModal': closeModal(); return;
    case 'noop': toast('Audio playback is mocked in this demo'); return;
    // technician
    case 'openJob': ui.techJob = id; break;
    case 'closeJob': ui.techJob = null; ui.techTab='today'; break;
    case 'techTab': ui.techTab = el.dataset.tab; if(el.dataset.tab!=='report') ui.techJob=null; else ui.reportFrom = ui.techJob; ui.techJob = null; break;
    case 'clockIn': { const j=job(id); const other=state.jobs.find(x=>x.techId===j.techId&&x.status==='in_progress'); if(other){ toast('Clock out of '+client(other.clientId).name+' first'); return; } locate(j, ()=>{ j.status='in_progress'; j.clockIn=Date.now(); j.inLoc=fakeFix(j); toast('Clocked in at '+fmtTime(j.clockIn)+(distFt(j.inLoc,client(j.clientId).pos)>GEOFENCE_FT?' · flagged: away from property':'')); }); return; }
    case 'clockOut': { const j=job(id); const left=taskCount(j)-j.done.length; locate(j, ()=>{ j.status='done'; j.clockOut=Date.now(); j.outLoc=fakeFix(j); toast('Clocked out · '+fmtHM(elapsed(j))+' on site'+(left?` · ${left} task${left>1?'s':''} left unchecked`:'')); }); return; }
    case 'toggleTask': { const j=job(id); const k=el.dataset.k; j.done = j.done.includes(k)? j.done.filter(x=>x!==k) : [...j.done,k]; break; }
    case 'submitReport': {
      const title=document.getElementById('rTitle').value.trim(); if(!title){ toast('Describe what\'s wrong'); return; }
      const eqId=document.getElementById('rEquip').value, prio=document.getElementById('rPrio').value;
      const fromTech = ui.role==='tech';
      const t={id:'EQ-'+(state.nextTicket++), equipId:eqId, title, desc:document.getElementById('rDesc').value.trim(), priority:prio, status:'New', reportedBy: fromTech?ui.techId:'Office', created:Date.now(), log:[], jobId: fromTech?(ui.reportFrom||state.jobs.find(j=>j.techId===ui.techId&&j.status==='in_progress')?.id||null):null};
      state.tickets.push(t);
      if(prio==='High') equip(eqId).status='Down'; else if(equip(eqId).status==='OK') equip(eqId).status='Needs service';
      closeModal(); ui.techTab='today'; ui.reportFrom=null; toast(t.id+' sent to the shop'); break; }
    // manager
    case 'jobModal': openModal(jobModalHTML(job(id))); return;
    case 'newJob': openModal(newJobModal()); return;
    case 'createJob': {
      const [name,price,est]=document.getElementById('nSvc').value.split('|');
      const j={id:'J'+Date.now(), date:document.getElementById('nDate').value||dayKey(1), start:document.getElementById('nStart').value, est:+est, techId:document.getElementById('nTech').value, clientId:document.getElementById('nClient').value, services:[{name,price:+price,tasks:['Complete '+name.toLowerCase(),'Clean up and haul debris']}], status:'scheduled', clockIn:null, clockOut:null, done:[]};
      state.jobs.push(j); closeModal(); toast('Scheduled for '+tech(j.techId).name+' · '+fmtDay(j.date)); break; }
    // mechanics
    case 'ticketModal': openModal(ticketModalHTML(state.tickets.find(t=>t.id===id))); return;
    case 'newTicket': openModal(newTicketModal()); return;
    case 'addLog': { const t=state.tickets.find(x=>x.id===id); const m=document.getElementById('logMsg').value.trim(); if(!m) return; t.log.push({t:Date.now(),by:'Shop',msg:m}); save(); openModal(ticketModalHTML(t)); render(); return; }
    // reception
    case 'recPick': ui.recId = id; break;
    case 'callPick': ui.callSel = id; break;
    case 'vmDone': state.calls.find(c=>c.id===id).handled = true; toast('Voicemail marked as returned'); break;
    // hr
    case 'hrPick': ui.hrSel = id; break;
    // team
    case 'teamDept': ui.teamDept = el.dataset.dept; break;
    case 'profile': openModal(profileHTML(state.staff.find(p=>p.id===id))); return;
    case 'copy': { const v = el.dataset.val;
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(el.previousElementSibling.querySelector('.trunc')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Selected. Press copy on your device'); };
      try { navigator.clipboard.writeText(v).then(()=>toast('Copied '+v), fallback); } catch(err){ fallback(); }
      return; }
    case 'hrToggle': { const emp=state.employees.find(x=>x.id===id); const o=el.dataset.kind==='paper'?emp.paper:emp.train; o[el.dataset.k]=!o[el.dataset.k]; if(empProgress(emp).pct===100) toast(emp.name+' is fully onboarded 🎉'); break; }
    case 'newHire': openModal(newHireModal()); return;
    case 'createHire': {
      const name=document.getElementById('hName').value.trim(); if(!name){ toast('Enter a name'); return; }
      const role=document.getElementById('hRole').value;
      const emp={id:'E'+(state.nextEmp++), name, role, start:document.getElementById('hStart').value||dayKey(7), manager:role==='Receptionist'?'Office manager':role.includes('Mechanic')?'Shop lead':'Crew lead',
        paper:Object.fromEntries(state.paperwork.map(([k])=>[k,false])), train:Object.fromEntries(ROLE_TRAININGS[role].map(k=>[k,false]))};
      state.employees.push(emp); ui.hrSel=emp.id;
      state.staff.push({id:'S'+emp.id, name, role, dept: role==='Receptionist'?'Office':role.includes('Mechanic')?'Shop':'Field crews', branch:'Yakima',
        email: name.split(' ')[0][0].toLowerCase()+name.split(' ').slice(-1)[0].toLowerCase()+'@coloniallawn.com', phone:'(509) 555-01'+String(20+state.nextEmp).slice(-2),
        start: emp.start, reportsTo: emp.manager, langs:['English'], certs:[], about:'New hire. Profile details get filled in during onboarding.', empId: emp.id}); closeModal(); toast('Onboarding started for '+name); break; }
    default: return;
  }
  render();
});

document.addEventListener('change', e=>{
  const el = e.target; const a = el.dataset.action; if(!a) return;
  if(a==='simAway'){ state.ui.simAway = el.checked; save(); return; }
  if(a==='techPick'){ state.ui.techId=el.value; state.ui.techJob=null; state.ui.techTab='today'; }
  else if(a==='callFilter'){ state.ui.callFilter=el.value; }
  else if(a==='reassign'){ const j=job(el.dataset.id); j.techId=el.value; toast('Reassigned to '+tech(el.value).name); closeModal(); }
  else if(a==='ticketStatus'){ const t=state.tickets.find(x=>x.id===el.dataset.id); t.status=el.value; t.log.push({t:Date.now(),by:'Shop',msg:'Status → '+el.value});
    if(el.value==='Resolved' && !state.tickets.some(x=>x.equipId===t.equipId&&x.status!=='Resolved')) equip(t.equipId).status='OK';
    save(); openModal(ticketModalHTML(t)); }
  else return;
  render();
});

let searchT;

/* simulated GPS fix: a moment to "locate", then a point near (or away from) the property */
function fakeFix(j){ return near(client(j.clientId).pos, state.ui.simAway ? 45+Math.random()*60 : 0.8+Math.random()*2.5); }
function locate(j, done){ state.ui.locating = j.id; render(); setTimeout(()=>{ state.ui.locating = null; done(); render(); }, 900); }

/* live timers */
setInterval(()=>{
  document.querySelectorAll('[data-live]').forEach(el=>{ const j=job(el.dataset.live); if(j) el.textContent=fmtDur(elapsed(j)); });
  const tot=document.querySelector('[data-live-total]');
  if(tot) tot.textContent=fmtHM(state.jobs.filter(j=>j.date===dayKey(0)).reduce((a,j)=>a+elapsed(j),0));
},1000);

render();
</script>
</body>
